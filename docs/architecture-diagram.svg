<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 840" width="1110" height="840" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Agrogami AI architecture</title>
  <desc id="d">Evidence-to-assessment pipeline in nine numbered steps: synthetic mobile-money SMS intake, template parsing, validation and reconciliation into an immutable event ledger, deterministic 30/60/90-day features, a model-ready bridge, an evidence gate that either withholds the assessment or passes to a calibrated risk model, TreeSHAP reasons and immutable assessment snapshots. Stored records are served through FastAPI and Streamlit to a loan officer, who makes the decision, and through the read-only Agrogami Prism MCP server, which external MCP clients query. An offline fairness audit of stored snapshots is implemented but not yet run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.4}
      .ev{fill:#ecfdf5;stroke:#059669;stroke-width:1.8}
      .ml{fill:#eff6ff;stroke:#2563eb;stroke-width:1.4}
      .mcp{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.4}
      .rv{fill:#fffbeb;stroke:#d97706;stroke-width:1.4}
      .off{fill:#ffffff;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 4}
      .person{fill:#1e293b;stroke:#0f172a;stroke-width:1.4}
      .dev{fill:none;stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 3}
      .h{font-size:14px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .s{font-size:12px;fill:#475569;text-anchor:middle}
      .hg{font-size:14px;font-weight:700;fill:#64748b;text-anchor:middle}
      .hp{font-size:14px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .sp{font-size:12px;fill:#e2e8f0;text-anchor:middle}
      .n{font-size:13px;fill:#475569}
      .q{font-size:12px;fill:#64748b}
      .lbl{font-size:12px;fill:#334155;font-style:italic}
      .lw{font-size:12px;fill:#92400e;font-style:italic}
      .ln{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lg{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ag)}
      .ld{stroke:#94a3b8;stroke-width:1.3;fill:none;stroke-dasharray:2 4;marker-end:url(#ag)}
      .lx{stroke:#b45309;stroke-width:1.5;fill:none;marker-end:url(#aw)}
      .lane{font-size:12px;font-weight:700;fill:#64748b;letter-spacing:.08em}
      .flow{font-size:12px;font-weight:700;fill:#334155}
      .bc{fill:#334155}
      .bn{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
  </defs>

  <rect width="1110" height="840" fill="#ffffff"/>

  <text x="30" y="44" font-size="22" font-weight="700" fill="#0f172a">Agrogami AI — evidence-to-assessment architecture</text>
  <text x="30" y="68" font-size="13" fill="#475569">Current release · synthetic data only · no generative model at runtime · a loan officer makes the decision</text>

  <text x="30" y="96" class="lane">EVIDENCE BOUNDARY</text>
  <text x="196" y="96" class="flow">steps 1–4 run left to right →</text>

  <!-- Row A: inputs to ledger, left to right -->
  <rect class="box" x="30" y="108" width="174" height="56" rx="8"/>
  <text class="h" x="117" y="131">Mobile-money SMS</text>
  <text class="s" x="117" y="149">synthetic bKash/Nagad-like</text>

  <rect class="off" x="30" y="180" width="174" height="68" rx="8"/>
  <text class="hg" x="117" y="203">Document images</text>
  <text class="s" x="117" y="221">checked and preprocessed,</text>
  <text class="s" x="117" y="237">no events created</text>
  <text class="n" x="30" y="270">TrOCR · LayoutLMv3 · DeBERTa-v3-small:</text>
  <text class="n" x="30" y="288">integration built, training next</text>

  <rect class="box" x="238" y="124" width="174" height="64" rx="8"/>
  <text class="h" x="325" y="147">Intake</text>
  <text class="s" x="325" y="165">SHA-256 hash, UUIDs</text>
  <text class="s" x="325" y="181">synthetic / real flag</text>

  <rect class="box" x="446" y="124" width="174" height="64" rx="8"/>
  <text class="h" x="533" y="147">Template parser</text>
  <text class="s" x="533" y="165">deterministic-synthetic-sms</text>
  <text class="s" x="533" y="181">v1.0 · exact field spans</text>

  <rect class="box" x="698" y="124" width="174" height="64" rx="8"/>
  <text class="h" x="785" y="147">Validate &amp; reconcile</text>
  <text class="s" x="785" y="165">duplicates, reversals,</text>
  <text class="s" x="785" y="181">own wallets, balance chain</text>

  <rect class="ev" x="906" y="124" width="174" height="64" rx="8"/>
  <text class="h" x="993" y="147">Immutable event ledger</text>
  <text class="s" x="993" y="165">SQLAlchemy, append-only</text>
  <text class="s" x="993" y="181">accepted events only</text>

  <rect class="rv" x="698" y="240" width="174" height="56" rx="8"/>
  <text class="h" x="785" y="263">Review queue</text>
  <text class="s" x="785" y="281">NEEDS_REVIEW · human fix</text>

  <path class="ln" d="M204,136 L236,150"/>
  <path class="lg" d="M204,210 L236,172"/>
  <path class="ln" d="M412,156 L444,156"/>
  <path class="ln" d="M620,156 L696,156"/>
  <path class="ln" d="M872,156 L904,156"/>
  <path class="ln" d="M785,188 L785,238"/>
  <text class="lbl" x="793" y="218">unsupported / ambiguous</text>
  <path class="ln" d="M872,268 L950,268 L950,190"/>
  <text class="lbl" x="880" y="287">correction appends version</text>

  <text x="30" y="326" class="lane">DETERMINISTIC FEATURES AND SCOPED MODEL</text>
  <text x="1030" y="326" class="flow" text-anchor="end">← steps 5–9 run right to left</text>

  <!-- Row B: right to left -->
  <rect class="box" x="906" y="350" width="174" height="64" rx="8"/>
  <text class="h" x="993" y="373">30/60/90-day features</text>
  <text class="s" x="993" y="391">window [t0 − w, t0)</text>
  <text class="s" x="993" y="407">missing = unknown, never 0</text>

  <rect class="box" x="698" y="350" width="174" height="64" rx="8"/>
  <text class="h" x="785" y="373">Model-ready bridge</text>
  <text class="s" x="785" y="391">rows with nulls excluded</text>
  <text class="s" x="785" y="407">no zero-filling</text>

  <rect class="ml" x="446" y="350" width="174" height="64" rx="8"/>
  <text class="h" x="533" y="373">Calibrated risk model</text>
  <text class="s" x="533" y="391">LightGBM · LR · XGBoost</text>
  <text class="s" x="533" y="407">Platt · SYNTHETIC_DEMO</text>

  <rect class="ml" x="238" y="350" width="174" height="64" rx="8"/>
  <text class="h" x="325" y="373">TreeSHAP reasons</text>
  <text class="s" x="325" y="391">controlled reason codes</text>
  <text class="s" x="325" y="407">linked to source events</text>

  <rect class="ev" x="30" y="350" width="174" height="64" rx="8"/>
  <text class="h" x="117" y="373">Assessment snapshot</text>
  <text class="s" x="117" y="391">immutable, versioned</text>
  <text class="s" x="117" y="407">score, or withheld (null)</text>

  <path class="ln" d="M1050,188 L1050,348"/>
  <text class="lbl" x="1042" y="225" text-anchor="end">as-of t0</text>
  <path class="ln" d="M906,382 L874,382"/>
  <path class="ln" d="M698,382 L674,382"/>
  <path class="ln" d="M646,382 L622,382"/>
  <text class="lbl" x="634" y="374" text-anchor="middle">yes</text>
  <path class="ln" d="M446,382 L414,382"/>
  <path class="ln" d="M238,382 L206,382"/>

  <!-- Evidence gate and the withheld path -->
  <path class="rv" d="M659,369 L672,382 L659,395 L646,382 z"/>
  <path class="lx" d="M659,395 L659,446 L150,446 L150,416"/>
  <text class="lw" x="651" y="418" text-anchor="end">no</text>
  <text class="lbl" x="669" y="436">gate: evidence complete and reviewed?</text>
  <text class="lw" x="238" y="438">"Assessment withheld": score stays null, model not run</text>
  <text class="n" x="238" y="474">A scored snapshot shows an illustrative 300–850 display score, labelled "not FICO"</text>

  <!-- Row C -->
  <path class="ln" d="M80,414 L80,578"/>
  <path class="ln" d="M80,540 L533,540 L533,578"/>
  <path class="ld" d="M533,540 L993,540 L993,578"/>
  <circle cx="80" cy="540" r="3" fill="#475569"/>
  <circle cx="533" cy="540" r="3" fill="#475569"/>
  <rect x="26" y="496" width="140" height="18" fill="#ffffff"/>
  <text x="30" y="510" class="lane">READ SURFACES</text>
  <text class="lbl" x="180" y="532">Prism reads stored records; never recomputes</text>
  <text class="lbl" x="763" y="532" text-anchor="middle">audits stored snapshots, offline</text>

  <rect class="box" x="30" y="580" width="174" height="64" rx="8"/>
  <text class="h" x="117" y="603">FastAPI /api/v1</text>
  <text class="s" x="117" y="621">role tokens, applicant grants</text>
  <text class="s" x="117" y="637">project /docs</text>

  <rect class="box" x="238" y="580" width="174" height="64" rx="8"/>
  <text class="h" x="325" y="603">Streamlit UI</text>
  <text class="s" x="325" y="621">10 pages via API client</text>
  <text class="s" x="325" y="637">"Unavailable" shown plainly</text>

  <rect class="mcp" x="446" y="580" width="174" height="64" rx="8"/>
  <text class="h" x="533" y="603">Agrogami Prism MCP</text>
  <text class="s" x="533" y="621">4 read-only tools</text>
  <text class="s" x="533" y="637">bearer auth, minimized</text>

  <rect class="mcp" x="698" y="580" width="174" height="64" rx="8"/>
  <text class="h" x="785" y="603">External MCP clients</text>
  <text class="s" x="785" y="621">OpenAI Codex · Claude Code</text>
  <text class="s" x="785" y="637">Streamable HTTP</text>

  <rect class="off" x="906" y="580" width="174" height="64" rx="8"/>
  <text class="hg" x="993" y="603">Offline fairness audit</text>
  <text class="s" x="993" y="621">protected attributes separate</text>
  <text class="s" x="993" y="637">implemented, not yet run</text>

  <path class="ln" d="M204,612 L236,612"/>
  <path class="ln" d="M698,612 L622,612"/>
  <text class="lbl" x="659" y="604" text-anchor="middle">read-only</text>
  <text class="lbl" x="659" y="629" text-anchor="middle">queries</text>
  <path class="ln" d="M325,644 L325,690"/>

  <!-- The human decision-maker: a person, not a software component -->
  <rect class="person" x="225" y="692" width="200" height="56" rx="28"/>
  <circle cx="256" cy="712" r="7" fill="#ffffff"/>
  <path d="M243,735 a13,12 0 0 1 26,0 z" fill="#ffffff"/>
  <text class="hp" x="346" y="716">Loan officer</text>
  <text class="sp" x="346" y="734">reviews and decides</text>

  <!-- Development-time boundary note: not part of the runtime -->
  <rect class="dev" x="698" y="696" width="382" height="48" rx="6"/>
  <text class="q" x="712" y="716" font-weight="600">Dev time only · Claude Code reads CloudCamp BD MCP</text>
  <text class="q" x="712" y="733">competition guidance; no applicant data crosses this line</text>

  <!-- Step badges -->
  <g>
    <circle class="bc" cx="252" cy="124" r="10"/><text class="bn" x="252" y="128">1</text>
    <circle class="bc" cx="460" cy="124" r="10"/><text class="bn" x="460" y="128">2</text>
    <circle class="bc" cx="712" cy="124" r="10"/><text class="bn" x="712" y="128">3</text>
    <circle class="bc" cx="920" cy="124" r="10"/><text class="bn" x="920" y="128">4</text>
    <circle class="bc" cx="920" cy="350" r="10"/><text class="bn" x="920" y="354">5</text>
    <circle class="bc" cx="712" cy="350" r="10"/><text class="bn" x="712" y="354">6</text>
    <circle class="bc" cx="460" cy="350" r="10"/><text class="bn" x="460" y="354">7</text>
    <circle class="bc" cx="252" cy="350" r="10"/><text class="bn" x="252" y="354">8</text>
    <circle class="bc" cx="44" cy="350" r="10"/><text class="bn" x="44" y="354">9</text>
  </g>

  <!-- Legend -->
  <rect class="box" x="30" y="776" width="28" height="16" rx="3"/>
  <text class="n" x="66" y="789">running in the current release</text>
  <rect class="off" x="270" y="776" width="28" height="16" rx="3"/>
  <text class="n" x="306" y="789">built, not active or not yet run</text>
  <rect class="ev" x="515" y="776" width="28" height="16" rx="3"/>
  <text class="n" x="551" y="789">immutable record</text>
  <rect class="ml" x="680" y="776" width="28" height="16" rx="3"/>
  <text class="n" x="716" y="789">synthetic-scope model</text>
  <rect class="mcp" x="875" y="776" width="28" height="16" rx="3"/>
  <text class="n" x="911" y="789">MCP</text>

  <rect class="rv" x="30" y="804" width="28" height="16" rx="3"/>
  <text class="n" x="66" y="817">human review / evidence gate</text>
  <rect class="person" x="270" y="804" width="28" height="16" rx="8"/>
  <text class="n" x="306" y="817">person, not software</text>
  <circle class="bc" cx="529" cy="812" r="9"/><text class="bn" x="529" y="816">1</text>
  <text class="n" x="551" y="817">pipeline step order</text>
  <path class="lx" d="M680,812 L708,812"/>
  <text class="n" x="716" y="817">assessment withheld</text>
  <path class="ld" d="M875,812 L903,812"/>
  <text class="n" x="911" y="817">offline, not yet run</text>
</svg>
