name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Windows matches constraints-tested.txt, which was captured on Windows with Python 3.14.8.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Exact version on purpose: if 3.14.8 is unavailable this step fails; there is no fallback.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-tested.txt

      - name: Install the tested environment (wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -c constraints-tested.txt -e ".[test,local,trees,fairness]"

      # Default suite: offline, no secrets, no model downloads; heavy checkpoint tests are deselected by pyproject.toml.
      - name: Run the default test suite
        run: python -m pytest -q
