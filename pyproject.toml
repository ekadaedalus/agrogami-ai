[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrogami"
version = "0.2.0"
description = "An explainable underwriting evidence and risk-audit workbench for thin-file credit."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.36,<3", "fastapi>=0.142,<1", "uvicorn>=0.34,<1", "Pillow>=12,<13", "numpy>=2.3,<3", "scikit-learn>=1.7,<2", "Markdown>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.13,<3", "streamlit>=1.50,<2", "mcp>=1.26,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
trees = ["lightgbm>=4.6,<5", "xgboost>=3,<4", "shap>=0.49,<1"]
fairness = ["fairlearn>=0.13,<1"]
models = ["transformers>=4.57,<6", "torch>=2.9,<3", "sentencepiece>=0.2,<1", "accelerate>=1,<2"]
ui = ["streamlit>=1.50,<2"]
mcp = ["mcp>=1.26,<2"]
local = ["streamlit>=1.50,<2", "mcp>=1.26,<2", "Markdown>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["heavy: optional local checkpoint tests; never downloads models"]
# Repo-local basetemp and no cache plugin: mirrors scripts/run_tests.ps1 and avoids ACL-locked
# system Temp pytest-of-<user> / stale cache directories on the development machine.
addopts = "-m 'not heavy' -p no:cacheprovider --basetemp=.pytest_temp/default"
